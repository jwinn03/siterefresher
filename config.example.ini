; Site Refresher configuration
; Copy this file to config.ini and fill in your values.
; Any setting can also be supplied via an environment variable named
; SR_<SECTION>_<KEY>, e.g. SR_WATCH_URL or SR_TELEGRAM_TOKEN.

[watch]
; The page to monitor.
url = https://example.com/tickets

; The phrase to watch for. A notification fires when its presence changes
; (appears or disappears).
phrase = Tickets Currently Not Available

; Random polling interval bounds, in seconds.
min_interval = 70
max_interval = 90

; How to fetch the page:
;   requests  = fast, no browser. Works for plain server-rendered pages.
;   selenium  = headless Chromium. Executes JavaScript and solves
;               non-interactive bot challenges (e.g. AWS WAF). Required for
;               sites like etix.com that render tickets via JS / sit behind a
;               WAF challenge.
fetch_backend = selenium

; Max seconds to wait for the page (and any JS challenge) to finish rendering.
page_load_timeout = 30

; HTTP request timeout in seconds.
request_timeout = 30

; Set to false only if the site uses a self-signed / broken certificate.
verify_tls = true

; Match the phrase case-sensitively (false = case-insensitive).
case_sensitive = false

; Where to persist the last-seen state (so restarts don't re-alert).
state_file = state.json

; Browser-like User-Agent. Some sites block the default requests UA.
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36

[selenium]
; Only used when fetch_backend = selenium.

; Run the browser without a visible window.
; IMPORTANT: Some anti-bot systems (e.g. DataDome, used by etix.com) detect and
; BLOCK headless browsers. For those sites you MUST set headless = false.
;   - Windows: a browser window will appear (you can minimise it).
;   - Raspberry Pi / headless Linux: there's no display, so run the program
;     under a virtual one with xvfb:
;         sudo apt install xvfb
;         xvfb-run -a python site_refresher.py
;     (keep headless = false; xvfb provides the "screen").
headless = false

; Leave both blank on Windows: Selenium auto-finds Chrome and its driver.
; On Raspberry Pi OS, after `sudo apt install chromium chromium-driver`, set:
;   browser_binary = /usr/bin/chromium
;   driver_path    = /usr/bin/chromedriver
browser_binary =
driver_path =

[telegram]
; From @BotFather after you create a bot.
token = 123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ

; Your chat/user id. Get it by messaging your bot, then calling:
;   https://api.telegram.org/bot<TOKEN>/getUpdates
; and reading result[].message.chat.id
chat_id = 987654321

; Send a startup message confirming the watcher is running.
notify_on_start = true

; Notify if the site becomes unreachable (after error_threshold failures).
notify_on_errors = true
error_threshold = 3
